[build]
command = "rm -rf .next && npx next build"
publish = ".next"

[build.environment]
SECRETS_SCAN_OMIT_KEYS = "GOOGLE_CLIENT_ID,UBER_CLIENT_ID,UBER_SANDBOX_CLIENT_ID,UBER_SANDBOX_CLIENT_SECRET"

[[plugins]]
package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"